SCF" target="_blank" rel="noopener"><title>pLSCF</title><rect x="720" y="386" width="300" height="78" rx="14" ry="14" fill="#D8F5D0" stroke="#5FAE55" stroke-width="2" filter="url(#boxshadow)"/><text x="870.0" y="416.2" font-size="19" font-weight="600" fill="#1F5A1A" text-anchor="middle">pLSCF</text><rect x="732.0" y="441.0" width="134.0" height="22" rx="11" ry="11" fill="#FFFFFF" fill-opacity="0.75" stroke="#5FAE55" stroke-width="1.3"/><text x="799.0" y="456.5" font-size="12.5" fill="#1F5A1A" text-anchor="middle">✓ CV</text><rect x="874.0" y="441.0" width="134.0" height="22" rx="11" ry="11" fill="#FFFFFF" fill-opacity="0.75" stroke="#5FAE55" stroke-width="1.3"/><text x="941.0" y="456.5" font-size="12.5" fill="#1F5A1A" text-anchor="middle">✓ UQ</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/oma.html#pyOMA.core.PRCE.PRCE" target="_blank" rel="noopener"><title>PRCE</title><rect x="720" y="494" width="300" height="64" rx="14" ry="14" fill="#D8F5D0" stroke="#5FAE55" stroke-width="2" filter="url(#boxshadow)"/><text x="870.0" y="528.7" font-size="19" font-weight="600" fill="#1F5A1A" text-anchor="middle">PRCE</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/oma.html#pyOMA.core.ERA.ERA" target="_blank" rel="noopener"><title>ERA</title><rect x="720" y="588" width="300" height="64" rx="14" ry="14" fill="#D8F5D0" stroke="#5FAE55" stroke-width="2" filter="url(#boxshadow)"/><text x="870.0" y="622.7" font-size="19" font-weight="600" fill="#1F5A1A" text-anchor="middle">ERA</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/core/pyOMA.GUI.StabilGUI.StabilGUI.html" target="_blank" rel="noopener"><title>Interactive Pole Selection (Stabilization Diagram)</title><rect x="1120" y="206" width="280" height="90" rx="14" ry="14" fill="#FFF3B0" stroke="#D4B93C" stroke-width="2" filter="url(#boxshadow)"/><text x="1260.0" y="241.2" font-size="19" font-weight="600" fill="#6B5900" text-anchor="middle">Interactive Pole Selection</text><text x="1260.0" y="266.2" font-size="19" font-weight="600" fill="#6B5900" text-anchor="middle">(Stabilization Diagram)</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/core/pyOMA.core.StabilDiagram.StabilCluster.html" target="_blank" rel="noopener"><title>Multi-Stage Clustering</title><rect x="1120" y="336" width="280" height="90" rx="14" ry="14" fill="#FFF3B0" stroke="#D4B93C" stroke-width="2" filter="url(#boxshadow)"/><text x="1260.0" y="383.7" font-size="19" font-weight="600" fill="#6B5900" text-anchor="middle">Multi-Stage Clustering</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/core/pyOMA.core.PostProcessingTools.MergePoSER.html" target="_blank" rel="noopener"><title>PoSER Multi-Setup Merging</title><rect x="1120" y="466" width="280" height="90" rx="14" ry="14" fill="#FFF3B0" stroke="#D4B93C" stroke-width="2" filter="url(#boxshadow)"/><text x="1260.0" y="513.7" font-size="19" font-weight="600" fill="#6B5900" text-anchor="middle">PoSER Multi-Setup Merging</text></a><a xlink:href="https://pyoma-monitoring.readthedocs.io/en/latest/" target="_blank" rel="noopener"><title>Structural Health Monitoring</title><rect x="1500" y="156" width="300" height="90" rx="14" ry="14" fill="#EAD9F7" stroke="#9B6FCE" stroke-width="2" filter="url(#boxshadow)"/><text x="1650.0" y="191.2" font-size="19" font-weight="600" fill="#4B2E6B" text-anchor="middle">Structural Health</text><text x="1650.0" y="216.2" font-size="19" font-weight="600" fill="#4B2E6B" text-anchor="middle">Monitoring</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/core/pyOMA.core.PlotMSH.ModeShapePlot.html" target="_blank" rel="noopener"><title>Modeshape Visualization</title><rect x="1500" y="276" width="300" height="90" rx="14" ry="14" fill="#EAD9F7" stroke="#9B6FCE" stroke-width="2" filter="url(#boxshadow)"/><text x="1650.0" y="323.7" font-size="19" font-weight="600" fill="#4B2E6B" text-anchor="middle">Modeshape Visualization</text></a><a xlink:href="https://py-oma.readthedocs.io/en/latest/core/pyOMA.core.PostProcessingTools.compare_modes.html" target="_blank" rel="noopener"><title>Mode Matching / Comparison</title><rect x="1500" y="396" width="300" height="90" rx="14" ry="14" fill="#EAD9F7" stroke="#9B6FCE" stroke-width="2" filter="url(#boxshadow)"/><text x="1650.0" y="431.2" font-size="19" font-weight="600" fill="#4B2E6B" text-anchor="middle">Mode Matching /</text><text x="1650.0" y="456.2" font-size="19" font-weight="600" fill="#4B2E6B" text-anchor="middle">Comparison</text></a><a xlink:href="https://github.com/simonmarwitz/PolyUQ" target="_blank" rel="noopener"><title>Uncertainty Quantification</title><rect x="1500" y="516" width="300" height="90" rx="14" ry="14" fill="#EAD9F7" stroke="#9B6FCE" stroke-width="2" filter="url(#boxshadow)"/><text x="1650.0" y="563.7" font-size="19" font-weight="600" fill="#4B2E6B" text-anchor="middle">Uncertainty Quantification</text></a><rect x="40" y="790" width="1800" height="170" rx="10" ry="10" fill="#F6F6F6" stroke="#AAAAAA" stroke-width="1.5"/><text x="58" y="816" font-size="16" font-weight="700" fill="#333">Legend</text><text x="58" y="840" font-size="13.5" font-weight="700" fill="#333">Methods:</text><text x="126.39999999999999" y="840" font-size="13.5" fill="#333">SSI-cov = Stochastic Subspace Identification (covariance-driven)  ·  SSI-data = Stochastic Subspace Identification (data-driven)  ·  pLSCF = poly-reference Least-Squares Complex Frequency</text><text x="58" y="867" font-size="13.5" fill="#333">PRCE = Poly-Reference Complex Exponential  ·  ERA = Eigensystem Realization Algorithm</text><text x="58" y="894" font-size="13.5" font-weight="700" fill="#333">Capabilities:</text><text x="164.39999999999998" y="894" font-size="13.5" fill="#333">CV = Cross-Validation  ·  UQ = Uncertainty Quantification</text><text x="58" y="921" font-size="13.5" font-weight="700" fill="#333">Merging methods:</text><text x="187.2" y="921" font-size="13.5" fill="#333">PoGER = Post-Global Estimation and Re-scaling  ·  PreGER = Pre-Global Estimation and Re-scaling  ·  PoSER = Post-Separate Estimation and Re-scaling</text><text x="1840" y="946" font-size="12" fill="#888" text-anchor="end">S. Marwitz, pyOMA</text></svg>

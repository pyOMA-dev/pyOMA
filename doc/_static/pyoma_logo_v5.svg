<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 800" width="700" height="800">

  <defs>
    <style>
      .navy    { fill:#1B3A6B; }
      .navy-s  { stroke:#1B3A6B; }
      .navyL-s { stroke:#7C93B5; }
      .grey-s  { stroke:#C7D0DB; }
      .wordmark { font-family:'Helvetica Neue', Arial, sans-serif; font-weight:700; }
    </style>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A9BD4"/>
      <stop offset="55%" stop-color="#4B8BBE"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="700" height="800" fill="#FFFFFF"/>

  <!-- inner content plate -->
  <circle cx="350" cy="365" r="248" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="3"/>

  <!-- ================= THREE ELEMENTS, ENLARGED, NO ARROWS ================= -->

  <!-- 1) random signal (top, bigger) -->
  <polyline points="255,235 270,205 285,255 300,190 315,240 330,195 345,260 360,205 375,235 390,190 405,245 420,210 435,235 450,215"
            fill="none" stroke="#1B3A6B" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 2) matrix / array pictogram (bigger) -->
  <g transform="translate(385,340)">
    <rect x="0" y="0" width="140" height="140" fill="none" stroke="#1B3A6B" stroke-width="2.4"/>
    <g stroke="#1B3A6B" stroke-width="1.2">
      <line x1="35" y1="0" x2="35" y2="140"/><line x1="70" y1="0" x2="70" y2="140"/><line x1="105" y1="0" x2="105" y2="140"/>
      <line x1="0" y1="35" x2="140" y2="35"/><line x1="0" y1="70" x2="140" y2="70"/><line x1="0" y1="105" x2="140" y2="105"/>
    </g>
    <g fill="#1B3A6B" opacity="0.55">
      <rect x="0" y="0" width="35" height="35"/><rect x="35" y="35" width="35" height="35"/>
      <rect x="70" y="70" width="35" height="35"/><rect x="105" y="105" width="35" height="35"/>
    </g>
    <g fill="#4B8BBE" opacity="0.5">
      <rect x="35" y="0" width="35" height="35"/><rect x="0" y="35" width="35" height="35"/>
      <rect x="105" y="70" width="35" height="35"/><rect x="70" y="105" width="35" height="35"/>
    </g>
  </g>

  <!-- 3) 3D frame, second mode shape (bigger) -->
  <g class="grey-s" fill="none" stroke-width="2.4" stroke-dasharray="5 5">
    <line x1="177" y1="505" x2="177" y2="310"/>
    <line x1="302" y1="505" x2="302" y2="310"/>
    <line x1="177" y1="505" x2="302" y2="505"/>
    <line x1="177" y1="415" x2="302" y2="415"/>
    <line x1="177" y1="310" x2="302" y2="310"/>
    <line x1="205" y1="525" x2="205" y2="330"/>
    <line x1="330" y1="525" x2="330" y2="330"/>
    <line x1="205" y1="525" x2="330" y2="525"/>
    <line x1="205" y1="435" x2="330" y2="435"/>
    <line x1="205" y1="330" x2="330" y2="330"/>
  </g>

  <g class="navyL-s" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 177,505 L 201,415 L 157,310"/>
    <path d="M 302,505 L 326,415 L 282,310"/>
    <line x1="177" y1="505" x2="302" y2="505"/>
    <line x1="201" y1="415" x2="326" y2="415"/>
    <line x1="157" y1="310" x2="282" y2="310"/>
  </g>

  <g class="navy-s" fill="none" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 205,525 L 229,435 L 185,330"/>
    <path d="M 330,525 L 354,435 L 310,330"/>
    <line x1="205" y1="525" x2="330" y2="525"/>
    <line x1="229" y1="435" x2="354" y2="435"/>
    <line x1="185" y1="330" x2="310" y2="330"/>
  </g>

  <g class="navyL-s" stroke-width="2.6">
    <line x1="177" y1="505" x2="205" y2="525"/>
    <line x1="302" y1="505" x2="330" y2="525"/>
    <line x1="201" y1="415" x2="229" y2="435"/>
    <line x1="326" y1="415" x2="354" y2="435"/>
    <line x1="157" y1="310" x2="185" y2="330"/>
    <line x1="282" y1="310" x2="310" y2="330"/>
  </g>

  <g class="navy" stroke="#FFFFFF" stroke-width="1.6">
    <circle cx="205" cy="525" r="5.5"/><circle cx="330" cy="525" r="5.5"/>
    <circle cx="229" cy="435" r="5.5"/><circle cx="354" cy="435" r="5.5"/>
    <circle cx="185" cy="330" r="5.5"/><circle cx="310" cy="330" r="5.5"/>
  </g>

  <line x1="155" y1="525" x2="355" y2="525" class="navy-s" stroke-width="3.2"/>
  <g class="navy-s" stroke-width="1.8">
    <line x1="165" y1="525" x2="153" y2="537"/><line x1="188" y1="525" x2="176" y2="537"/>
    <line x1="211" y1="525" x2="199" y2="537"/><line x1="234" y1="525" x2="222" y2="537"/>
    <line x1="257" y1="525" x2="245" y2="537"/><line x1="280" y1="525" x2="268" y2="537"/>
    <line x1="303" y1="525" x2="291" y2="537"/><line x1="326" y1="525" x2="314" y2="537"/>
    <line x1="349" y1="525" x2="337" y2="537"/>
  </g>

  <!-- ================= WORDMARK ================= -->
  <text x="350" y="740" text-anchor="middle" class="wordmark navy" font-size="64">py<tspan fill="#4B8BBE">OMA</tspan></text>

</svg>

---
# Paths excluded from Codacy analysis.
#
# This file is tracked on purpose: the equivalent settings in .codacy/codacy.yaml
# belong to the local Codacy CLI, and .codacy/ is gitignored, so Codacy Cloud
# never sees them.
#
# tests/**
#   pytest's assertion API *is* the bare `assert` statement, so Bandit B101
#   ("use of assert") fires once per assertion. That accounted for 449 of the
#   543 issues on the dashboard. B101 stays enabled for pyOMA/, where a bare
#   assert in library code is a genuine finding.
#
# pyOMA/GUI/generated/**
#   Qt Designer output, regenerated by scripts/build_ui.py. Not hand-maintained,
#   so its complexity and unused-import findings are not actionable.
exclude_paths:
  - 'tests/**'
  - 'doc/**'
  - 'build/**'
  - '_build/**'
  - 'scripts/**'
  - '.claude/**'
  - 'pyOMA/GUI/generated/**'

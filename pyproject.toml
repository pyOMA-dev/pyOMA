[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoma-toolbox"
version = "1.1.0"
description = "Python toolbox for Operational Modal Analysis (OMA)"
readme = "README.rst"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Simon Marwitz", email = "25247720+simonmarwitz@users.noreply.github.com" },
    { name = "Volkmar Zabel" },
]
keywords = ["structural dynamics", "modal analysis", "OMA", "system identification", "SSI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
gui = [
    "PyQt6",
]
jupyter = [
    "ipywidgets",
    "ipython",
    "ipympl",
    "jupyterlab",
]
# Optional pyvista/VTK mode-shape backends (pyOMA.core.PlotMSHpv).
# Markered on 3.10+ rather than raising requires-python, so the base install
# keeps supporting Python 3.9.
pyvista = [
    "pyvista>=0.48; python_version>='3.10'",
    "pyvistaqt>=0.12; python_version>='3.10'",
    "trame>=3.13; python_version>='3.10'",
    "trame-vtk>=2.11; python_version>='3.10'",
    "trame-vuetify>=3.2; python_version>='3.10'",
    # pyvista's trame backends launch their server via nest_asyncio2 when not
    # already inside an await; without it 'client' mode silently degrades to a
    # static image.
    "nest_asyncio2; python_version>='3.10'",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-qt",
    "PyQt6",
    "pre-commit",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "myst-nb",
    "sphinxcontrib-blockdiag",
    "sphinx-collections",
    "autoclasstoc",
    "pyoma-toolbox[gui,jupyter]",
]

[project.scripts]
pyoma = "pyOMA.GUI.MultiSetupGUI:main"

[project.urls]
Homepage = "https://github.com/pyOMA-dev/pyOMA"
Documentation = "https://py-oma.readthedocs.io"
Repository = "https://github.com/pyOMA-dev/pyOMA"
"Bug Tracker" = "https://github.com/pyOMA-dev/pyOMA/issues"
"Cite via Zenodo" = "https://doi.org/10.5281/zenodo.14936576"

[tool.setuptools.packages.find]
exclude = ["tests*", "doc*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
qt_api = "pyqt6"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "gui: marks tests that require a display (deselect with -m 'not gui')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
# Qt Designer output is excluded from Codacy analysis (see .codacy.yaml), so keep
# it out of the coverage report too. Importing those modules marks every line as
# covered, which inflated the reported figure by about five points.
omit = ["pyOMA/GUI/generated/*"]
